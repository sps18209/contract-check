[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contract-check"
version = "0.1.0"
description = "Auditable contract structure and revision engine"
requires-python = ">=3.10"

[project.scripts]
contract-check = "contract_check.cli:main"

[tool.setuptools.packages.find]
include = ["contract_check*"]
