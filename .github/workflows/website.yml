name: Website build and preview
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'scripts/build_site.py'
      - 'scripts/test_site.mjs'
      - '.github/workflows/website.yml'
      - 'wrangler.jsonc'
      - 'package.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - run: npx wrangler deploy --dry-run --outdir /tmp/topcontractreview-worker
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test_site.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: topcontractreview-preview
          path: |
            website/screenshots/
            website/topcontractreview-site.zip
      - name: Save site download
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v0.2.2 website/topcontractreview-site.zip --clobber
