name: Package downloads
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package.yml'
      - 'scripts/package_release.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Build and verify archives
        run: python scripts/package_release.py "$RUNNER_TEMP/contract-check-release"
      - name: Publish development downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.2 \
            "$RUNNER_TEMP/contract-check-release/contract-check-2026-development.zip" \
            "$RUNNER_TEMP/contract-check-release/contract-check-plugin.zip" \
            "$RUNNER_TEMP/contract-check-release/contract-check-direct-upload.zip" \
            "$RUNNER_TEMP/contract-check-release/SHA256SUMS.txt" \
            --target "$GITHUB_SHA" --prerelease \
            --title "Contract Check 0.2.2 development" \
            --notes "Complete portable skill and ChatGPT plugin packages with all four review forms, references, and Python runtime. Development edition; host behavior and lawyer review remain separate validation steps."
